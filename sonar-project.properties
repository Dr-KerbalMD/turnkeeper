sonar.projectKey=scooper4711_turnkeeper
sonar.organization=scooper4711

sonar.sources=Sources,scripts,ios/App,.github
sonar.tests=Tests,ios/UITests
# Asset catalogs hold images and JSON metadata, not code.
sonar.exclusions=ios/App/Assets.xcassets/**
sonar.sourceEncoding=UTF-8

# Written by scripts/coverage.sh from the test run's coverage data.
sonar.coverageReportPaths=coverage/sonar-coverage.xml

# SwiftUI views, the entry points and the import and build tools are not unit tested; the logic lives in
# TurnkeeperKit and CharacterImport, which is what the coverage gate measures.
sonar.coverage.exclusions=Sources/TurnkeeperUI/**,Sources/Turnkeeper/**,Sources/BestiaryImport/**,\
  Sources/CardSnapshots/**,scripts/**,ios/**
